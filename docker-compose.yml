services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: praktikum
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass123"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    image: ${IMAGE_NAME:-urayfaizmuhajir/flask-mysql-app}:${TAG:-latest}
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: appuser
      DB_PASSWORD: apppass123
      DB_NAME: praktikum
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
